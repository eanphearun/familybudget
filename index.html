<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Family Budget</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="fam">
      <div class="avatar">👨‍👩‍👧‍👦</div>
      <div>
        <div class="name">Family Budget</div>
        <div class="sub" id="monthLabel">This month</div>
      </div>
    </div>
    <div class="sync" id="userTag"></div>
  </div>

  <div class="balance-card">
    <div class="label">Combined balance</div>
    <div class="amount" id="balanceAmt">$0.00</div>
    <div class="row">
      <div class="stat"><div class="l">Income</div><div class="v in" id="monthIn">$0.00</div></div>
      <div class="stat"><div class="l">Expenses</div><div class="v out" id="monthOut">$0.00</div></div>
      <div class="stat"><div class="l">Net</div><div class="v" id="monthNet">$0.00</div></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="overview">Overview</div>
    <div class="tab" data-tab="add">Add</div>
    <div class="tab" data-tab="history">History</div>
  </div>

  <div id="tab-overview">
    <div class="section">
      <div class="section-title">Spending by category</div>
      <div class="card-list" id="catList"></div>
    </div>
  </div>

  <div id="tab-add" style="display:none;">
    <div class="section">
      <div class="card-list" style="padding:16px;">
        <div class="field">
          <label>Type</label>
          <div class="toggle">
            <div id="toggleOut" class="sel-out">Expense</div>
            <div id="toggleIn">Income</div>
          </div>
        </div>
        <div class="field">
          <label>Amount</label>
          <input type="number" id="fAmount" placeholder="0.00" inputmode="decimal">
        </div>
        <div class="field">
          <label>Account</label>
          <select id="fAccount"></select>
        </div>
        <div class="field">
          <label>Category</label>
          <select id="fCategory"></select>
        </div>
        <div class="field">
          <label>Note (optional)</label>
          <input type="text" id="fNote" placeholder="e.g. Weekly groceries">
        </div>
        <div class="err" id="formErr">Enter an amount first.</div>
      </div>
    </div>
  </div>

  <div id="tab-history">
    <div class="section">
      <div class="section-title">Recent transactions</div>
      <div class="card-list" id="txnList"></div>
    </div>
  </div>
</div>

<div class="mainbtn-wrap" id="mainbtnWrap" style="display:none;">
  <button class="mainbtn" id="mainBtn">Add transaction</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
